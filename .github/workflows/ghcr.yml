name: Publish Coolify image to GHCR

on:
  push:
    branches:
      - main
      - feat/coolify-ghcr-publishing

permissions:
  contents: read

concurrency:
  group: ghcr-coolify-dev
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'michmzr/transition-summarize-py' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/coolify-ghcr-publishing')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Scan source for credentials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          hide-progress: true

      - name: Build source candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/michmzr/av-summarizer-py:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run networkless candidate import and model tests
        env:
          IMAGE: ghcr.io/michmzr/av-summarizer-py:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint python \
            -e TESTING=true -e OPENAI_API_KEY=ci-placeholder -e SECRET_KEY=ci-placeholder \
            "$IMAGE" -c '
          import compileall, runpy
          assert compileall.compile_dir("app", quiet=1)
          import app.settings, app.auth, uvicorn
          tests = runpy.run_path("tests/test_models_metadata.py")
          for name, test in tests.items():
              if name.startswith("test_"):
                  test()
          print("Candidate imports and four model tests passed")
          '

      - name: Block fixed high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/michmzr/av-summarizer-py:sha-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 10m
          hide-progress: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable candidate and promote Coolify channel
        env:
          IMAGE: ghcr.io/michmzr/av-summarizer-py:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          test -n "$digest" && test "$digest" != null
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/michmzr/av-summarizer-py:coolify-dev \
            "ghcr.io/michmzr/av-summarizer-py@$digest"
          printf 'Published `ghcr.io/michmzr/av-summarizer-py@%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
